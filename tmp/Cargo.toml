# Workspace manifest for naos.
#
# See ARCHITECTURE.md for the project ladder. Additional member crates
# (naos-macos, naos-vmm) will be added here as their stages begin.

[workspace]
resolver = "2"
members = ["crates/naos-linux"]

[workspace.package]
edition = "2021"
# Keep this loose — the rust-toolchain.toml file pins the actual version.
rust-version = "1.75"

[workspace.dependencies]
# Shared crate versions will be declared here as they are introduced by
# concrete code. Deliberately empty for now — no dependency is "shared"
# until two crates actually need it, and no crate is using any dependency
# yet. See DESIGN-naos-linux for the planned dependency list.

# Workspace-wide lint configuration. Applied to every member crate via
# `[lints] workspace = true` in each crate's Cargo.toml.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Start conservative. Add more strict lints as the code matures.
pedantic = { level = "warn", priority = -1 }
# Opt out of pedantic lints that are more noise than signal.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
