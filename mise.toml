[tools]
# Install rust with the components the toolchain needs: rustfmt (fmt), clippy
# (lint), and llvm-tools (cargo-llvm-cov coverage instrumentation). mise's rust
# governs the active toolchain, so the components must be declared here — and
# also in rust-toolchain.toml for anyone driving rustup directly.
rust = { version = "latest", components = "rustfmt,clippy,llvm-tools" }
just = "latest"
# Rust coverage. cargo-llvm-cov is a cargo subcommand; it relies on the
# llvm-tools component installed with rust above.
"aqua:taiki-e/cargo-llvm-cov" = "latest"
shellcheck = "latest"
shfmt = "latest"


# Repo utilities
# Formatters and linters
markdownlint-cli2 = "0.18.1"
yamlfmt = "0.20.0"
yamllint = "1.37.1"
prettier = "3.7.4"
"github:donaldgifford/makefmt" = "latest"
checkmake = "latest"
git-cliff = "latest"

# tools
yq = "4.48.1"
jq = "latest"
"github:donaldgifford/docz" = "latest"
